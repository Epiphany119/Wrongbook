server:
  address: 0.0.0.0
  port: 8080

spring:
  profiles:
    default: local
  application:
    name: wrongbook-api
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/wrongbook?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:epiphany}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  auth:
    dev-mode: ${DEV_AUTH_ENABLED:true}
    session-days: 30
  storage:
    location: "${APP_STORAGE_LOCATION:/Users/epiphany/Files From d.localized/SomeWorks/本科大三资料/贺卫国-软件项目管理/uploads}"
    max-file-bytes: 10485760
