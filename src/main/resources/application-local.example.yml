# 本机开发配置示例。复制为 application-local.yml 后在 api-key 中填写 DeepSeek API Key。
app:
  deepseek-vision:
    enabled: true
    api-key: ""
    api-url: https://api.deepseek.com/chat/completions
    model: deepseek-flash
    timeout: 120s
    max-image-bytes: 10485760
    min-readable-characters: 5
    min-content-ratio: 0.30
